[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msme-financial-health-card"
version = "0.1.0"
description = "AI-driven credit assessment for New-to-Credit MSMEs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pytest>=7.4.0",
    "pydantic>=2.0.0",
    "xgboost>=1.7.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "shap>=0.41.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "streamlit>=1.22.0",
    "plotly>=5.14.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=xml"
